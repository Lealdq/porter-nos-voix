<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <rect width="240" height="160" fill="#e2f2fb"/>
  <rect width="240" height="20" fill="#e8000d"/>
  <text x="120" y="14" font-family="sans-serif" font-size="7" fill="#e2f2fb" text-anchor="middle" letter-spacing="1">PORTER NOS VOIX</text>
  <!-- champ texte pancarte -->
  <text x="12" y="33" font-family="sans-serif" font-size="5" fill="#4d2882" opacity=".5">texte de la pancarte</text>
  <rect x="8" y="36" width="180" height="0.7" fill="#e8000d" opacity=".5"/>
  <!-- tags thèmes -->
  <rect x="8"   y="44" width="22" height="6" rx="2" fill="none" stroke="#e8000d" stroke-width="0.6" opacity=".5"/>
  <rect x="33"  y="44" width="28" height="6" rx="2" fill="none" stroke="#e8000d" stroke-width="0.6" opacity=".5"/>
  <rect x="64"  y="44" width="22" height="6" rx="2" fill="#e8000d" stroke="#e8000d" stroke-width="0.6" opacity=".3"/>
  <rect x="89"  y="44" width="30" height="6" rx="2" fill="none" stroke="#e8000d" stroke-width="0.6" opacity=".5"/>
  <!-- champs ville/pays -->
  <text x="12" y="62" font-family="sans-serif" font-size="5" fill="#4d2882" opacity=".5">ville</text>
  <rect x="8" y="65" width="80" height="0.7" fill="#e8000d" opacity=".5"/>
  <text x="100" y="62" font-family="sans-serif" font-size="5" fill="#4d2882" opacity=".5">pays</text>
  <rect x="96" y="65" width="80" height="0.7" fill="#e8000d" opacity=".5"/>
  <!-- zone dépôt photo -->
  <rect x="8" y="74" width="140" height="48" rx="1" fill="none" stroke="#e8000d" stroke-width="0.7" opacity=".4"/>
  <text x="78" y="104" font-family="sans-serif" font-size="5" fill="#4d2882" opacity=".4" text-anchor="middle">glisser une image</text>
  <!-- bouton submit -->
  <rect x="8" y="130" width="140" height="14" rx="1" fill="#e8000d" opacity=".8"/>
  <text x="78" y="140" font-family="sans-serif" font-size="6" fill="#e2f2fb" text-anchor="middle">envoyer →</text>
</svg>
