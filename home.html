<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.png" type="image/png"><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8000d">
  <title>porter nos voix</title>
  <link rel="stylesheet" href="style.css?v=34">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #e8000d;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font);
    }

    /* Écran 1 : titre */
    #ecran-1 {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      transition: opacity 0.5s ease;
      z-index: 10;
    }
    #ecran-1.cache { opacity: 0; pointer-events: none; }

    #ecran-1 span {
      font-size: 0.85rem;
      color: #e2f2fb;
      text-transform: lowercase;
      letter-spacing: 0.03em;
      line-height: 1.2;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      #ecran-1, #ecran-2 {
        flex-direction: column !important;
        justify-content: center !important;
        align-items: flex-start !important;
        padding: 0 1.5rem !important;
        gap: 0.35rem !important;
      }
      #ecran-1 span, #ecran-2 span {
        max-width: 100% !important;
        font-size: 1rem !important;
        width: 100% !important;
      }
    }
    #ecran-1 span::first-letter,
    #ecran-2 span::first-letter { text-transform: uppercase; }

    /* Écran 2 : même layout que écran 1 */
    #ecran-2 {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: calc(50vh - 0.51rem) 2rem 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
    }
    #ecran-2.visible { opacity: 1; pointer-events: auto; }

    #ecran-2 span {
      font-size: 0.85rem;
      color: #e2f2fb;
      letter-spacing: 0.03em;
      line-height: 1.2;
      max-width: 28%;
      text-align: left;
      font-weight: 700;
    }

    /* Fade sortie */
    #fade {
      position: fixed;
      inset: 0;
      background: #4d2882;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, background 0.4s ease;
      z-index: 9999;
    }
    #fade.actif { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

  <div id="lang-home" style="position:fixed;top:0.6rem;right:1rem;z-index:9999;display:flex;align-items:center;gap:0.3rem;font-family:var(--font);font-size:0.72rem;font-weight:700;">
    <button class="lang-btn" data-lang="fr" style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:inherit;font-weight:inherit;color:#e2f2fb;padding:0;transition:color 0.15s;">FR</button>
    <span style="color:#e2f2fb;opacity:0.5;">/</span>
    <button class="lang-btn" data-lang="en" style="background:none;border:none;cursor:pointer;font-family:inherit;font-size:inherit;font-weight:inherit;color:#e2f2fb;padding:0;transition:color 0.15s;">EN</button>
  </div>

  <div id="ecran-1">
    <span>Porter nos voix</span>
    <span data-i18n="home-sous-titre">Archive de pancartes féministes</span>
    <span data-i18n="home-date">8 mars</span>
  </div>

  <div id="ecran-2">
    <span data-i18n="home-ecran2-1">Porter nos voix est une archive photographique de pancartes issues des manifestations du 8 mars, journée internationale des droits des femmes et des minorités de genre.</span>
  </div>

  <div id="fade"></div>

  <script src="nav.js"></script>
  <script src="lang.js"></script>
  <script src="caps.js"></script>
  <script>
    // Sélecteur de langue sur la landing — sans déclencher la navigation
    (function () {
      const boutons = document.querySelectorAll('#lang-home .lang-btn');
      const VIOLET = '#4d2882';
      const BLEU   = '#e2f2fb';

      function refletColor() {
        const lang = (window.getLang && window.getLang()) || 'fr';
        boutons.forEach(b => {
          b.style.color = b.dataset.lang === lang ? VIOLET : BLEU;
        });
      }

      boutons.forEach(btn => {
        // Empêcher le clic de remonter au body (qui ferait avancer/changer de page)
        ['click', 'mousedown', 'mouseup'].forEach(evt =>
          btn.addEventListener(evt, e => e.stopPropagation())
        );
        btn.addEventListener('click', () => {
          // lang.js applique déjà la langue ; on met juste à jour la couleur
          setTimeout(refletColor, 0);
        });
      });

      // Couleur initiale selon la langue mémorisée
      refletColor();
      document.addEventListener('langchange', refletColor);
    })();
  </script>
  <script>
    // ── Navigation écrans ─────────────────────────────────────────────────────
    const fade   = document.getElementById('fade');
    const ecran1 = document.getElementById('ecran-1');
    const ecran2 = document.getElementById('ecran-2');
    let etape = 1;
    let cooldown = false;

    function avancer() {
      if (cooldown) return;
      cooldown = true;
      if (etape === 1) {
        ecran1.classList.add('cache');
        ecran2.classList.add('visible');
        etape = 2;
        setTimeout(() => { cooldown = false; }, 600);
      } else if (etape === 2) {
        // Violet d'abord
        fade.classList.add('actif');
        document.body.style.background = '#4d2882';
        // Mettre à jour theme-color pour la barre système iOS
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.content = '#4d2882';
        etape = 3;
        // Puis transition vers bleu avant navigation
        setTimeout(() => {
          fade.style.background = '#e2f2fb';
          document.body.style.background = '#e2f2fb';
          if (themeMeta) themeMeta.content = '#e2f2fb';
        }, 400);
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      }
    }

    document.body.addEventListener('click', avancer);

    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 30) avancer();
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (touchStartY - e.changedTouches[0].clientY > 40) avancer();
    }, { passive: true });
  </script>
</body>
</html>
