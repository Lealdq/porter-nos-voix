  <!-- ── FILTRES ──────────────────────────────────────────── -->
  <div class="filtres-bar" role="search" aria-label="Filtres et recherche">
    <div class="container">

      <!-- Barre visible permanente -->
      <div class="filtres-top">
        <div class="filtres-top-left">
          <button class="filtres-toggle" id="btn-filtres" data-i18n="filtrer" aria-expanded="false" aria-controls="filtres-panel" aria-label="Filtres">
            filtrer
          </button>
          <div class="effacer-col">
            <button id="btn-effacer" class="btn-effacer" data-i18n="tout-effacer" aria-label="Effacer tous les filtres" hidden>
              tout effacer
            </button>
            <!-- Filtres appliqués, en colonne sous "tout effacer" -->
            <div id="filtres-actifs-bar" class="filtres-actifs-bar" hidden></div>
          </div>
          <!-- Panneau filtres ancré sous le bouton -->
          <div class="filtres-panel" id="filtres-panel" hidden>
            <div class="filtres-panel-inner">
              <div class="filtre-dropdown" id="dd-annee" data-cle="annee">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-annee">année</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
              <div class="filtre-dropdown" id="dd-ville" data-cle="ville">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-ville">ville</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
              <div class="filtre-dropdown" id="dd-pays" data-cle="pays">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-pays">pays</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
              <div class="filtre-dropdown" id="dd-langue" data-cle="langue">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-langue">langue</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
              <div class="filtre-dropdown" id="dd-categorie" data-cle="categorie">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-categorie">catégorie</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
              <div class="filtre-dropdown" id="dd-couleur" data-cle="couleur">
                <button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" data-i18n="filtre-couleur">couleur</button>
                <div class="dd-panel" role="listbox" aria-multiselectable="true"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="filtres-top-right">
          <div class="col-picker" id="col-picker" aria-label="Nombre de colonnes">
            <!-- 2 colonnes -->
            <button class="col-num" data-col="2" aria-label="2 colonnes" title="2 colonnes">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="1" y="1" width="5" height="12" rx="0.5"/>
                <rect x="8" y="1" width="5" height="12" rx="0.5"/>
              </svg>
            </button>
            <!-- 3 colonnes -->
            <button class="col-num" data-col="3" aria-label="3 colonnes" title="3 colonnes">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="1"   y="1" width="3" height="12" rx="0.5"/>
                <rect x="5.5" y="1" width="3" height="12" rx="0.5"/>
                <rect x="10"  y="1" width="3" height="12" rx="0.5"/>
              </svg>
            </button>
            <!-- 4 colonnes -->
            <button class="col-num" data-col="4" aria-label="4 colonnes" title="4 colonnes">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="1"    y="1" width="2" height="12" rx="0.5"/>
                <rect x="4.33" y="1" width="2" height="12" rx="0.5"/>
                <rect x="7.67" y="1" width="2" height="12" rx="0.5"/>
                <rect x="11"   y="1" width="2" height="12" rx="0.5"/>
              </svg>
            </button>
            <!-- 6 colonnes -->
            <button class="col-num col-num-actif" data-col="6" aria-label="6 colonnes" title="6 colonnes">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                <rect x="1"    y="1" width="1.2" height="12" rx="0.5"/>
                <rect x="3.36" y="1" width="1.2" height="12" rx="0.5"/>
                <rect x="5.72" y="1" width="1.2" height="12" rx="0.5"/>
                <rect x="8.08" y="1" width="1.2" height="12" rx="0.5"/>
                <rect x="10.44" y="1" width="1.2" height="12" rx="0.5"/>
                <rect x="12.8" y="1" width="1.2" height="12" rx="0.5"/>
              </svg>
            </button>
          </div>
          <div class="recherche-wrapper" style="position:relative;">
            <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="champ-recherche" placeholder="recherche par mot…" aria-label="Rechercher dans les pancartes" autocomplete="off">
            <div class="mots-cles-strip" aria-label="Mots-clés suggérés">
              <span class="mot-cle-chip" data-mot="femme">femme</span>
              <span class="mot-cle-chip" data-mot="patriarcat">patriarcat</span>
              <span class="mot-cle-chip" data-mot="corps">corps</span>
              <span class="mot-cle-chip" data-mot="droits">droits</span>
              <span class="mot-cle-chip" data-mot="violence">violence</span>
              <span class="mot-cle-chip" data-mot="avortement">avortement</span>
              <span class="mot-cle-chip" data-mot="travail">travail</span>
              <span class="mot-cle-chip" data-mot="égalité">égalité</span>
              <span class="mot-cle-chip" data-mot="solidarité">solidarité</span>
              <span class="mot-cle-chip" data-mot="liberté">liberté</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const btnFiltres = document.getElementById('btn-filtres');
    const filtresPanel = document.getElementById('filtres-panel');
    const filtresTopLeft = btnFiltres.closest('.filtres-top-left');
    btnFiltres.addEventListener('click', (e) => {
      e.stopPropagation();
      const ouvert = !filtresPanel.hidden;
      filtresPanel.hidden = ouvert;
      btnFiltres.setAttribute('aria-expanded', String(!ouvert));
      btnFiltres.classList.toggle('actif', !ouvert);
      filtresTopLeft.classList.toggle('panneau-ouvert', !ouvert);
    });
    document.addEventListener('click', (e) => {
      if (!filtresPanel.contains(e.target) && e.target !== btnFiltres) {
        filtresPanel.hidden = true;
        btnFiltres.setAttribute('aria-expanded', 'false');
        btnFiltres.classList.remove('actif');
        filtresTopLeft.classList.remove('panneau-ouvert');
      }
    });
  </script>

  <script src="gallery.js?v=17"></script>
  <script>
    // Cacher filtres au scroll bas, réafficher au scroll haut
    let dernierScroll = 0;
    const filtresBar = document.querySelector('.filtres-bar');
    window.addEventListener('scroll', () => {
      const scrollActuel = window.scrollY;
      if (scrollActuel > 60) {
        filtresBar.classList.toggle('masque', scrollActuel > dernierScroll);
      } else {
        filtresBar.classList.remove('masque');
      }
      dernierScroll = scrollActuel;

      // Mettre à jour l'indicateur d'année
      const midY = window.innerHeight / 2;
      const sections = document.querySelectorAll('.annee-section');
      let anneeVisible = '';
      sections.forEach(s => {
        const rect = s.getBoundingClientRect();
        if (rect.top <= midY && rect.bottom >= midY) anneeVisible = s.id.replace('annee-', '');
      });
      if (!anneeVisible && sections.length) {
        anneeVisible = sections[0].id.replace('annee-', '');
      }
      const ind = document.getElementById('annee-indicator');
      if (ind && anneeVisible) {
        ind.textContent = anneeVisible;
        // Si tout en haut : positionner au-dessus de la première pancarte
        const firstSection = sections[0];
        if (firstSection) {
          const firstRect = firstSection.getBoundingClientRect();
          if (firstRect.top > 0) {
            ind.style.top = (firstRect.top - 4) + 'px';
            ind.style.transform = 'none';
          } else {
            ind.style.top = '50%';
            ind.style.transform = 'translateY(-50%)';
          }
        }
      }
    }, { passive: true });

    // Init indicateur au chargement de la galerie
    document.addEventListener('galerie-chargee', () => {
      window.dispatchEvent(new Event('scroll'));
    });
  </script>
